[tool.ruff]
# Keep ruff's baseline broad and non-blocking on the first gate.
# Once the存量 is cleaned up, we can flip to strict.
line-length = 130
target-version = "py312"

# First-party modules live under app/ at the repo root. Ruff runs from hub-backend/
# so we point src to ".".
src = ["."]

# Do not autofix on save or in CI -- fail loudly instead.
fix = false

# Exclude one-shot scaffolding that predates the lint gate or intentionally
# mirrors a legacy style (alembic migration scripts, e2e fixtures, etc.).
extend-exclude = [
    "migrations/versions",
    "tests",
    "smoke",
    "plugin_smoke",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    "build",
]

[tool.ruff.lint]
# Enable the error and pycodestyle core rules, plus bugbear, pyupgrade,
# and flake8-bugbear common findings. Keep I (isort) to normalise
# imports and simplify reviews.
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings (exclude E501 below)
    "I",       # isort
    "B",       # flake8-bugbear (logic bugs)
    "UP",      # pyupgrade (keep on py3.12+)
    "N",       # pep8-naming (class/function naming)
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking (unused TYPE_CHECKING guards)
    "ARG",     # flake8-unused-arguments
]

# Rules we intentionally skip on day one. Each item should eventually
# graduate into the select set once the codebase is clean.
ignore = [
    # Column limit -- the existing code uses 130 above; only fail on the
    # harder W rules (E501 only).
    "E501",
    # Some FastAPI endpoints use `Depends(...)` as a default-value callable;
    # fixing that would need signature refactors (see flake8-bugbear B006).
    "B006",
    # FastAPI's `body: dict = Body(default_factory=dict)` triggers B008.
    "B008",
    # Some models use mutable default lists for non-pydantic dataclasses.
    "B009",
    # `assert ..., e` where e is Exception is common; keep as-is.
    "B017",
    # Naming rules that collide with SQLModel/SQLAlchemy class conventions.
    "N801",
    "N802",
    "N806",
    # Some legacy code uses NotImplemented instead of raise NotImplementedError.
    "B013",

    # ---------- Additional ignores gated on baseline ----------
    # These were all present before the lint gate; each should be removed
    # from this list once the owning component is cleaned up.
    #
    # pyupgrade --unsafe-fixes items we intentionally keep.
    "UP031",  # printf-style f-strings that need manual review.

    # flake8-type-checking -- FastAPI/SQLAlchemy imports commonly used at
    # runtime (AsyncSession, Request, Response) are flagged as "move to
    # TYPE_CHECKING", but that breaks DI wiring.
    "TC001",
    "TC002",
    "TC003",

    # flake8-unused-arguments -- FastAPI endpoints declare every request
    # parameter in the signature even when they read it only from Pydantic.
    "ARG001",
    "ARG002",
    "ARG005",

    # flake8-simplify patterns we do not want to auto-apply:
    #   SIM105  pass in except blocks (deliberate no-op / error masking)
    #   SIM102  nested if (readability trumps one-liner)
    #   SIM108  if-else vs if-exp (line length 130)
    #   SIM112  env var lowercase
    #   SIM115  open-file-with-context-handler patterns
    #   SIM117  multiple with
    #   SIM118  key in dict
    #   SIM114  if-with-same-arms
    #   SIM212  if-expr twisted arms
    #   SIM103  needless bool
    "SIM",

    # pep8-naming sub-rules that conflict with existing SQLModel / exception conventions.
    "N803",
    "N813",
    "N814",
    "N815",  # mixed-case in class scope (ORM field naming)
    "N818",  # Exception missing Error suffix

    # Multiple statements on one line (legacy style we are not rewriting en masse).
    "E701",
    "E702",
    "E731",
    "E402",  # module import not at top (sys.path bootstrapping)
    "E401",  # multiple imports on one line

    # flake8-bugbear patterns accepted by the codebase:
    "B904",  # raise without from
    "B905",  # zip without strict=True
    "B007",  # unused loop control variable
    "B023",  # loop variable capture (intended in some closures)
    "B018",  # useless expression (frequent in type-coercion chains)

    # Whitespace cosmetic.
    "W293",

    # pyflakes false positives for dynamic ORM attributes:
    # F841/F821/F811 are rare; fix the genuine ones during future PRs.
]

# pyflakes genuine bugs we *do* block on today. Remove F841/F821 when the
# handful of remaining dynamic attributes are either fixed or verified.
extend-select = []


[tool.ruff.lint.isort]
known-first-party = ["app"]
# Separate stdlib / third-party / first-party groups (ruff default).
force-single-line = false

[tool.ruff.lint.per-file-ignores]
# Laxer rules for one-shot scripts at the repo root.
"e2e_*.py" = ["I", "N", "SIM"]
"benchmark_*.py" = ["I", "N", "SIM"]
"db_admin.py" = ["I", "N"]
"full_backup.py" = ["I", "N"]
"audit_conversation_content.py" = ["I", "N"]
"import_client_release.py" = ["I", "N"]
"client_test_payload.py" = ["I", "N"]

# app-level: pyflakes falsely flags the except-bound variable `exc` inside
# an inner async closure — the code is correct at runtime; the closure is
# scheduled before the except block exits.
"app/services/video_generation.py" = ["F841", "F821"]

# ---------------------------------------------------------------------------
# mypy -- run from hub-backend/ with the package installed on PYTHONPATH.
# Start conservative: catch type errors in app/ only, leave tests/smoke and
# the one-shot scripts to ruff. Flip to strict = true once ruff is green.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
platform = "linux"
# FastAPI + SQLAlchemy + pydantic 2.x stubs are inconsistent about Any in 3rd-party
# APIs; tolerate missing stubs rather than 4000+ errors on the first run.
ignore_missing_imports = true
# Show error codes for review without a wall of "Need type annotation:".
show_error_codes = true
# Keep --warn-return-any off initially; the goal is 0 "incompatible" and
# "name defined as Any" before tightening.
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = false
# FastAPI Depends() returns callables that are fine as defaults.
disallow_untyped_defs = false
# Follow __init__.py imports.
follow_imports = "silent"
# Ignore alembic migration one-shot scripts entirely.
exclude = [
    "(^|/)migrations/versions/",
    "(^|/)tests/",
    "(^|/)smoke/",
    "(^|/)plugin_smoke/",
    "(^|/)build/",
]

[[tool.mypy.overrides]]
module = [
    # Third-party packages shipped without stubs.
    "pyNfsClient.*",
    "truststore.*",
    "pg8000.*",
    "PyMySQL.*",
    "pymongo.*",
    "dnspython.*",
    "pynfs4.*",
    "nfs_rs.*",
    "librt.*",
]
ignore_missing_imports = true
