name: Source checks

on:
  push:
    branches-ignore: ['release/**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Source HTTP startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Check prerequisites and launcher regressions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python start.py --check --desktop
          else
            python start.py --check --desktop
          fi
          python -m unittest tools.dev.test_start_local tools.dev.test_deploy tools.dev.test_source_export tools.security.test_scan_secrets
      - name: Check public source and documentation
        run: |
          node tools/check-public-source.cjs
          python tools/github/check_public_ci.py
          node tools/check-repository-layout.cjs
          node tools/check-third-party.cjs
          node tools/brand-keyword-gate.cjs
          node tools/check-docs.cjs
          node --test tools/source-manifest.test.cjs tools/check-docs.test.cjs tools/check-source-provenance.test.cjs tools/ci/test-release-transfer.cjs client/tests/repository-layout.test.cjs
          python -m unittest discover -s tools/github -p 'test_*.py'
      - name: Verify isolated HTTP startup, persistence, and shutdown
        run: python tools/dev/verify_local_start.py
      - name: Show isolated launcher logs when startup verification fails
        if: failure()
        shell: bash
        run: |
          find "${TMPDIR:-/tmp}" -type f -name '*.launcher-*.log' -print -exec tail -200 {} \; 2>/dev/null || true
          find "${TMPDIR:-/tmp}" -type f -path '*/soduwork-source-live-*/startup.log' -print -exec tail -200 {} \; 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: hub-frontend
      - run: npm run build
        working-directory: hub-frontend
      - run: node --test tests/*.test.mjs
        working-directory: hub-frontend

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare backend interpreter used by client contracts
        shell: bash
        run: |
          python -m venv hub-backend/.venv
          if [ "$RUNNER_OS" = Windows ]; then
            hub-backend/.venv/Scripts/python.exe -m pip install -r hub-backend/requirements-test.txt
            choco install ripgrep --no-progress --yes
            echo 'C:\\ProgramData\\chocolatey\\bin' >> "$GITHUB_PATH"
            rg --version
          else
            hub-backend/.venv/bin/python -m pip install -r hub-backend/requirements-test.txt
            sudo apt-get update
            sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2 ripgrep
            rg --version
          fi
      - run: npm ci
        working-directory: client
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
        working-directory: client
      - run: npm test
        if: runner.os == 'Windows'
        working-directory: client

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r hub-backend/requirements-test.txt
      - run: python quality_gate.py --profile release --scope backend
        working-directory: hub-backend
      - name: Verify every Runner dialogue profile through real fixture subprocesses
        run: python -m unittest -v test_runner_dialogue
        working-directory: hub-backend

  postgres:
    name: PostgreSQL migration, backup and restore
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: soduwork
          POSTGRES_PASSWORD: soduwork-ci-only
          POSTGRES_DB: soduwork_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U soduwork -d soduwork_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify PostgreSQL key download recovery
        run: python -m unittest -v tools.github.test_postgres_download
      - name: Install PostgreSQL 16 tools from the official repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/postgresql.asc
          sudo install -m 644 /tmp/postgresql.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - run: python -m pip install -r hub-backend/requirements.txt
      - run: python tools/github/postgres.py
        env:
          DATABASE_URL: postgresql+asyncpg://soduwork:soduwork-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/soduwork_ci
