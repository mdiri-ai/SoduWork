name: Public release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build and accept once
        type: choice
        options: [source, client, hub]
        required: true
      version:
        description: Version X.Y.Z matching the protected release/<component>-X.Y.Z branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.component }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_COMPONENT: ${{ inputs.component }}
  RELEASE_VERSION: ${{ inputs.version }}
  PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
  GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
  PYTHONUTF8: '1'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/release.py preflight
        env:
          GH_TOKEN: ${{ github.token }}

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  security:
    needs: preflight
    uses: ./.github/workflows/security.yml

  source:
    needs: [quality, security]
    if: inputs.component == 'source'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/build.py source --output release-out/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-source
          path: release-out/source/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  client:
    needs: [quality, security]
    if: inputs.component == 'client'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: windows, os: windows-2022, arch: x64}
          - {shard: linux, os: ubuntu-22.04, arch: x64}
          - {shard: macos-arm64, os: macos-26, arch: arm64}
          - {shard: macos-x64, os: macos-15-intel, arch: x64}
          - {shard: android, os: ubuntu-22.04, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Require the reviewed public Android source
        if: matrix.shard == 'android'
        run: test -f mobile/pubspec.yaml || { echo 'The public branch does not contain reviewed mobile/ source'; exit 1; }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.shard == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: matrix.shard == 'android'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare Linux package tools
        if: runner.os == 'Linux' && matrix.shard != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
      - name: Prepare macOS signing and notarization
        if: startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/prepare-macos-signing.sh
        env:
          SODUWORK_MAC_CERTIFICATE_B64: ${{ secrets.SODUWORK_MAC_CERTIFICATE_B64 }}
          SODUWORK_MAC_CERTIFICATE_PASSWORD: ${{ secrets.SODUWORK_MAC_CERTIFICATE_PASSWORD }}
          SODUWORK_MAC_KEYCHAIN_PASSWORD: ${{ secrets.SODUWORK_MAC_KEYCHAIN_PASSWORD }}
          SODUWORK_MAC_SIGN_IDENTITY: ${{ secrets.SODUWORK_MAC_SIGN_IDENTITY }}
          SODUWORK_MAC_NOTARY_KEY_ID: ${{ secrets.SODUWORK_MAC_NOTARY_KEY_ID }}
          SODUWORK_MAC_NOTARY_ISSUER: ${{ secrets.SODUWORK_MAC_NOTARY_ISSUER }}
          SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64: ${{ secrets.SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64 }}
          SODUWORK_MAC_NOTARY_PROFILE: ${{ secrets.SODUWORK_MAC_NOTARY_PROFILE }}
      - name: Build once and run native installation acceptance
        if: matrix.shard != 'android'
        run: python tools/github/build.py ${{ matrix.shard }} --output release-out/${{ matrix.shard }}
        env:
          SODUWORK_MAC_SIGN_IDENTITY: ${{ startsWith(matrix.shard, 'macos-') && secrets.SODUWORK_MAC_SIGN_IDENTITY || '' }}
      - name: Enable Android emulator acceleration
        if: matrix.shard == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and accept Android APK on an ephemeral emulator
        if: matrix.shard == 'android'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: python tools/github/build.py android --output release-out/android
        env:
          SODUWORK_ANDROID_KEYSTORE_B64: ${{ secrets.SODUWORK_ANDROID_KEYSTORE_B64 }}
          SODUWORK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SODUWORK_ANDROID_KEYSTORE_PASSWORD }}
          SODUWORK_ANDROID_KEY_ALIAS: ${{ secrets.SODUWORK_ANDROID_KEY_ALIAS || 'soduwork-release' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-${{ matrix.shard }}
          path: release-out/${{ matrix.shard }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Clean up macOS signing material
        if: always() && startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/cleanup-macos-signing.sh

  hub:
    needs: [quality, security]
    if: inputs.component == 'hub'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/build.py hub --output release-out/hub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-hub
          path: release-out/hub/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  candidate:
    needs: [source, client, hub]
    if: >-
      always() && !cancelled() &&
      (needs.source.result == 'success' || needs.client.result == 'success' || needs.hub.result == 'success') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accepted-*
          merge-multiple: true
          path: release-out/candidate
      - run: python tools/github/release.py candidate --folder release-out/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: candidate
        with:
          name: release-candidate
          path: release-out/candidate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Explain the manual gate
        shell: bash
        run: |
          echo 'Candidate passed. Create the protected component-vX.Y.Z tag at this exact commit, then approve public-release. Do not start another run or rebuild.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA / Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}

  publish:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: public-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: release-out/candidate
          merge-multiple: true
      - name: Verify tag, publish the accepted bytes and verify public downloads
        run: python tools/github/release.py publish --folder release-out/candidate
        env:
          GH_TOKEN: ${{ github.token }}
