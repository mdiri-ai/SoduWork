name: Draft release

on:
  workflow_dispatch:
    inputs:
      component:
        description: all builds Client and Hub together; source/client/hub are diagnostic subsets
        type: choice
        options: [all, source, client, hub]
        default: all
        required: true
      version:
        description: Unified version X.Y.Z matching the protected release/X.Y.Z branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_COMPONENT: ${{ inputs.component }}
  RELEASE_VERSION: ${{ inputs.version }}
  PUBLIC_RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPOSITORY }}
  GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
  PYTHONUTF8: '1'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/release.py preflight
        env:
          GH_TOKEN: ${{ github.token }}

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  security:
    needs: preflight
    uses: ./.github/workflows/security.yml

  source:
    needs: [quality, security]
    if: inputs.component == 'source'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/build.py source --output release-out/source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-source
          path: release-out/source/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  client:
    needs: [quality, security]
    if: inputs.component == 'client' || inputs.component == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: windows, os: windows-2022, arch: x64}
          - {shard: linux, os: ubuntu-22.04, arch: x64}
          - {shard: macos-arm64, os: macos-26, arch: arm64}
          - {shard: macos-x64, os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Prepare Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 rpm libarchive-tools
      - name: Prepare macOS signing and notarization
        if: startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/prepare-macos-signing.sh
        env:
          SODUWORK_MAC_CERTIFICATE_B64: ${{ secrets.SODUWORK_MAC_CERTIFICATE_B64 }}
          SODUWORK_MAC_CERTIFICATE_PASSWORD: ${{ secrets.SODUWORK_MAC_CERTIFICATE_PASSWORD }}
          SODUWORK_MAC_KEYCHAIN_PASSWORD: ${{ secrets.SODUWORK_MAC_KEYCHAIN_PASSWORD }}
          SODUWORK_MAC_SIGN_IDENTITY: ${{ secrets.SODUWORK_MAC_SIGN_IDENTITY }}
          SODUWORK_MAC_NOTARY_KEY_ID: ${{ secrets.SODUWORK_MAC_NOTARY_KEY_ID }}
          SODUWORK_MAC_NOTARY_ISSUER: ${{ secrets.SODUWORK_MAC_NOTARY_ISSUER }}
          SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64: ${{ secrets.SODUWORK_MAC_NOTARY_PRIVATE_KEY_B64 }}
          SODUWORK_MAC_NOTARY_PROFILE: ${{ secrets.SODUWORK_MAC_NOTARY_PROFILE }}
      - name: Build once and run native installation acceptance
        run: python tools/github/build.py ${{ matrix.shard }} --output release-out/${{ matrix.shard }}
        env:
          SODUWORK_MAC_SIGN_IDENTITY: ${{ startsWith(matrix.shard, 'macos-') && secrets.SODUWORK_MAC_SIGN_IDENTITY || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-${{ matrix.shard }}
          path: release-out/${{ matrix.shard }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Clean up macOS signing material
        if: always() && startsWith(matrix.shard, 'macos-')
        run: bash tools/ci/cleanup-macos-signing.sh
      - name: Retain failed installation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.shard }}
          path: |
            release-evidence/**/*.log
            release-evidence/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  hub:
    needs: [quality, security]
    if: inputs.component == 'hub' || inputs.component == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/github/build.py hub --output release-out/hub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-hub
          path: release-out/hub/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  candidate:
    needs: [source, client, hub]
    if: >-
      always() && !cancelled() &&
      (needs.source.result == 'success' || needs.client.result == 'success' || needs.hub.result == 'success') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: accepted-*
          merge-multiple: true
          path: release-out/candidate
      - run: python tools/github/release.py candidate --folder release-out/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate
        with:
          name: release-candidate
          path: release-out/candidate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Explain the manual gate
        shell: bash
        run: |
          echo 'Candidate passed. The next job creates a Draft Release for internal testing. No automatic public publication.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA / Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}

  draft:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: release-out/candidate
          merge-multiple: true
      - name: Upload and verify the accepted bytes as a draft only
        run: python tools/github/release.py draft --folder release-out/candidate
        env:
          GH_TOKEN: ${{ github.token }}
