name: Native package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Package ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: windows, os: windows-2022, arch: x64}
          - {shard: linux, os: ubuntu-22.04, arch: x64}
          - {shard: macos-arm64, os: macos-26, arch: arm64}
          - {shard: macos-x64, os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PACKAGE_VALIDATION_REPOSITORY: ${{ vars.PACKAGE_VALIDATION_REPOSITORY }}
      PYTHONUTF8: '1'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify workflow and public source boundary
        run: |
          python -m unittest discover -s tools/github -p 'test_*.py'
          python tools/github/check_public_ci.py
          node tools/check-public-source.cjs
      - name: Install Linux packaging prerequisites
        if: matrix.shard == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 rpm libarchive-tools xvfb xauth
      - name: Build native desktop installers
        run: python tools/github/validate_packages.py ${{ matrix.shard }} --output release-evidence/${{ matrix.shard }}-build.json
      - name: Retain build evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-validation-${{ matrix.shard }}
          path: release-evidence/${{ matrix.shard }}-build.json
          if-no-files-found: error
          retention-days: 30
