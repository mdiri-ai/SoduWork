name: Native package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Package ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: windows, os: windows-2022, arch: x64}
          - {shard: linux, os: ubuntu-22.04, arch: x64}
          - {shard: macos-arm64, os: macos-26, arch: arm64}
          - {shard: macos-x64, os: macos-15-intel, arch: x64}
          - {shard: android, os: ubuntu-22.04, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PACKAGE_VALIDATION_REPOSITORY: ${{ vars.PACKAGE_VALIDATION_REPOSITORY }}
      PYTHONUTF8: '1'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify workflow and public source boundary
        run: |
          python -m unittest discover -s tools/github -p 'test_*.py'
          python tools/github/check_public_ci.py
          node tools/check-public-source.cjs
      - name: Install Linux packaging prerequisites
        if: matrix.shard == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools xvfb xauth
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.shard == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: matrix.shard == 'android'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build native desktop installers
        if: matrix.shard != 'android'
        run: python tools/github/validate_packages.py ${{ matrix.shard }} --output release-evidence/${{ matrix.shard }}-build.json
      - name: Enable Android emulator acceleration
        if: matrix.shard == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and install Android with a disposable test key
        if: matrix.shard == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: python tools/github/validate_packages.py android --output release-evidence/android-build.json
      - name: Retain build evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-validation-${{ matrix.shard }}
          path: release-evidence/${{ matrix.shard }}-build.json
          if-no-files-found: error
          retention-days: 30
