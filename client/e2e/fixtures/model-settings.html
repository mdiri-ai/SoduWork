<script>
// These journeys begin with Chinese assertions before testing language changes.
window.cfg={locale:'zh-CN'};
window.errors=[];addEventListener('error',e=>errors.push(e.message));
addEventListener('unhandledrejection',e=>errors.push(String(e.reason?.stack||e.reason)));
// Match core/store.js: top-level lexical helpers are not window properties.
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
window.petSay=message=>window.notice=message;window._humanErr=e=>e.message;
window.saved=[];window.testCalls=[];window.capabilityCalls=[];window.testFailure=false;window.saveFailure=false;window.capabilityFailure=false;
window.fixture={providers:[
 {id:'company',name:'共享模型服务',baseUrl:'https://gateway.example.test/v1',kind:'openai-compat',keySet:true,modelNames:['default-multimodal'],modelDefs:[{name:'default-multimodal',modality:'chat',config:{imageRouting:'native'}}]},
 {id:'personal',name:'OpenAI 兼容（个人）',baseUrl:'https://personal.example.test/v1',kind:'openai-compat',myKeySet:true,myKeyLen:32,modelNames:[]},
 {id:'deepseek',name:'DeepSeek',baseUrl:'https://api.example.test/v1',modelNames:['deepseek-chat','deepseek-reasoner']},
 {id:'glm',name:'智谱 GLM',baseUrl:'https://glm.example.test/v1',modelNames:['glm-flash']},
 {id:'claude',name:'Anthropic Claude',baseUrl:'https://claude.example.test',kind:'anthropic',modelNames:['claude-model']},
 {id:'local',name:'本机开发服务',baseUrl:'http://127.0.0.1:11434/v1',personal:true,authMode:'none',modelNames:['local-model']}
],myModels:[{providerId:'personal',name:'business-review-model',label:'business-review-model',config:{thinkingMode:'always',thinkingFormat:'zai',imageRouting:'auto',capabilities:{imageInput:'unknown'},maxOutputTokens:8192},ctxWindow:128000}],
usable:[{providerId:'company',name:'default-multimodal',keyFrom:'org'},{providerId:'personal',name:'business-review-model',keyFrom:'mine'}]};
window.SoduWorkAPI={myModels:async()=>structuredClone(fixture),hubBase:()=> 'isolated-model-ui',
checkMyModelCapabilities:async body=>{capabilityCalls.push(structuredClone(body));await new Promise(r=>setTimeout(r,240));if(capabilityFailure)throw Error('能力检测未完成，请重试');const checks=Object.fromEntries(body.checks.map(key=>[key,{status:'passed',code:'verified'}]));const capabilityProfile=Object.fromEntries(['imageInput','toolCalling','streaming'].map(key=>[key,{state:'supported',source:'verified'}]));return {ok:true,checks,capabilityProfile,checkedAt:'2026-09-30T08:00:00Z',configRevision:'fixture-v1',runtimeRevision:'fixture-run-v1'};},
saveMyModels:async body=>{
 if(saveFailure)throw Error('模拟保存失败');
 saved.push(structuredClone(body));
 const local=Array.isArray(body.localProviders),keys=(local?body.localKeys:body.keys)||{};
 fixture.myModels=fixture.myModels.filter(m=>!!m.localOnly!==local).concat(structuredClone((local?body.localModels:body.models)||[]));
 if(local)fixture.providers=fixture.providers.filter(p=>!p.localOnly);
 for(const provider of (local?body.localProviders:body.providers)||[]){
  let p=fixture.providers.find(x=>x.id===provider.id);
  if(!p){p={...provider,modelNames:[]};fixture.providers.push(p)}else Object.assign(p,provider);
  if(keys[p.id]){p.myKeySet=true;p.myKeyLen=keys[p.id].length}
 }
},
testMyModel:async id=>{testCalls.push(id);await new Promise(r=>setTimeout(r,160));return testFailure?{ok:false,detail:'连接失败：请检查 API 地址与凭据'}:{ok:true,detail:'连接成功 · 测试模型可用'}}};
window.WorkspaceHost={open:()=>{}};
</script>
