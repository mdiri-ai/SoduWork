<!-- Start the watchdog heartbeat before other scripts so later load failures cannot prevent it. -->
<script>
(function(){
  if(!window.soduWorkAPI||!window.soduWorkAPI.sendHeartbeat)return;
  // Send a heartbeat immediately, then every two seconds.
  window.soduWorkAPI.sendHeartbeat();
  setInterval(function(){
    try{window.soduWorkAPI.sendHeartbeat();}catch(e){}
  },2000);
})();
</script>
